# nginx.conf — served as /etc/nginx/templates/default.conf.template
#
# ${PORT} is substituted at container start by the official nginx image's
# built-in envsubst mechanism. Railway injects PORT as a runtime env var.
# For local Docker testing: docker run -e PORT=8080 ...

server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── SPA routing ───────────────────────────────────────────────
    # Any path that does not match a real file falls back to index.html,
    # allowing Vue Router to handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── index.html: never cache ────────────────────────────────────
    # Ensures users always get the latest deployment. Vite's hashed
    # asset filenames handle cache-busting for everything else.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma        "no-cache";
    }

    # ── Hashed static assets: cache aggressively ──────────────────
    # Vite appends content hashes to JS/CSS filenames, so these can be
    # cached indefinitely — any change produces a new filename.
    location ~* \.(js|css|woff2?|ttf|eot|otf|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires       1y;
        add_header    Cache-Control "public, immutable";
        access_log    off;
    }

    # ── Compression ───────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
