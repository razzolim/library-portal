# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Tests

on:
  pull_request:
    branches: [ main, master ]   # or leave empty to run on PRs to any branch
  # Optional: also run on pushes to main
  # push:
  #   branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]   # adjust as needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'               # or 'yarn' / 'pnpm'

      - name: Install dependencies
        run: npm ci                  # preferred over npm install

      - name: Run tests
        run: npm test                # or yarn test / pnpm test